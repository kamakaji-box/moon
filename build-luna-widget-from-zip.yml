name: Build LUNA widget APK from prototype ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "luna-widget-prototype.zip"
      - ".github/workflows/build-luna-widget-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack widget source
        run: unzip -q luna-widget-prototype.zip -d .luna-widget-build

      - name: Build debug APK
        run: gradle -p .luna-widget-build/luna-widget assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luna-widget-debug-apk
          path: .luna-widget-build/luna-widget/app/build/outputs/apk/debug/app-debug.apk
