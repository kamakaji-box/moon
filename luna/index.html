<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020307" />
    <meta name="description" content="今夜の月を、月面地名と一緒に静かに眺めるミニアプリの試作" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css?v=20260912-phase3" />
    <title>Luna — 月面アトラス試作</title>
  </head>
  <body>
    <main class="app" aria-label="月面アトラス">
      <section id="viewport" class="viewport" aria-label="月。ピンチで拡大、ドラッグで移動">
        <div id="moonShell" class="moon-shell" aria-hidden="true">
          <img id="moonImage" class="moon-image" src="assets/lroc_color_2k.jpg" alt="NASA LROC由来の月面全球カラー地図" />
          <div class="limb-shade"></div>
          <svg id="phaseOverlay" class="phase-overlay" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <filter id="phaseRimBlur" x="-12" y="-12" width="124" height="124" filterUnits="userSpaceOnUse">
                <feGaussianBlur stdDeviation="1.15"></feGaussianBlur>
              </filter>
            </defs>
            <path id="phaseShadow" fill="#020307" fill-opacity="0.88" stroke="#020307" stroke-width="1.05" stroke-linejoin="round" stroke-linecap="round"></path>
            <circle id="phaseRimGlow" cx="50" cy="50" r="49.25" fill="none" stroke-width="2.2" opacity="0.12" filter="url(#phaseRimBlur)"></circle>
            <circle id="phaseRim" cx="50" cy="50" r="49.25" fill="none" stroke-width="0.58" opacity="0.24"></circle>
          </svg>
        </div>

        <div id="labels" class="labels" aria-label="月面地名">
          <!-- labels are positioned from data/landmarks.js; text never scales with zoom -->
        </div>

        <div class="quiet-title" aria-hidden="true">
          <span class="quiet-title__mark">LUNA</span>
          <span class="quiet-title__sub">月面アトラス・試作</span>
        </div>

        <div id="todayMoon" class="today-moon" aria-live="polite">
          <div class="today-moon__heading">今日の月</div>
          <div id="moonDate" class="today-moon__date">—</div>
          <div id="moonAge" class="today-moon__age">月齢 —</div>
          <div id="moonPhase" class="today-moon__phase">月の様子を計算中…</div>
        </div>

        <button id="devToggle" class="dev-toggle" type="button" aria-pressed="false">座標</button>
        <button id="resetView" class="reset-view" type="button">月を中央へ</button>

        <aside id="devPanel" class="dev-panel" hidden aria-live="polite">
          <div class="dev-panel__heading">開発表示</div>
          <div id="devReadout">読み込み中…</div>
          <div id="probeReadout" class="probe-readout">月面をタップすると正規化座標を取得</div>
        </aside>

        <div id="hint" class="hint">触れて、寄って、眺める</div>
        <div class="source-note">NASA SVS / LROC color map · prototype</div>
      </section>
    </main>

    <script type="module" src="app.js?v=20260912-phase3"></script>
  </body>
</html>
